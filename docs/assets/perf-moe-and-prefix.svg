<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460">

  <style>
    :root {
      --bg: #ffffff;
      --panel: #f6f8fa;
      --border: #d0d7de;
      --grid: #e1e4e8;
      --axis: #57606a;
      --text: #1f2328;
      --muted: #656d76;
      --blue: #0969da;
      --blue-soft: #54aeff;
      --teal: #0e8a6d;
      --green: #1a7f37;
      --amber: #9a6700;
      --purple: #8250df;
      --orange: #bc4c00;
      --gray-line: #6e7781;
      --bar-muted: #afb8c1;
      --badge-bg: #ddf4ff;
      --badge-text: #0969da;
      --callout-bg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --border: #30363d;
        --grid: #21262d;
        --axis: #8b949e;
        --text: #e6edf3;
        --muted: #8b949e;
        --blue: #58a6ff;
        --blue-soft: #79c0ff;
        --teal: #39d353;
        --green: #3fb950;
        --amber: #d29922;
        --purple: #bc8cff;
        --orange: #ffa657;
        --gray-line: #8b949e;
        --bar-muted: #484f58;
        --badge-bg: #1f334d;
        --badge-text: #79c0ff;
        --callout-bg: #161b22;
      }
    }
    svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: var(--bg); }
    .panel { fill: var(--panel); stroke: var(--border); stroke-width: 1; }
    .title { font-size: 16px; font-weight: 700; fill: var(--text); }
    .subtitle { font-size: 12px; fill: var(--muted); }
    .panel-title { font-size: 13.5px; font-weight: 600; fill: var(--text); }
    .axis-label { font-size: 11.5px; font-weight: 600; fill: var(--muted); }
    .tick { font-size: 10.5px; fill: var(--muted); }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--axis); stroke-width: 1.2; }
    .legend-text { font-size: 11px; fill: var(--text); }
    .legend-muted { font-size: 10.5px; fill: var(--muted); }
    .val { font-size: 10.5px; font-weight: 600; fill: var(--text); }
    .val-blue { font-size: 10.5px; font-weight: 700; fill: var(--blue); }
    .val-green { font-size: 10.5px; font-weight: 700; fill: var(--green); }
    .val-purple { font-size: 10.5px; font-weight: 700; fill: var(--purple); }
    .val-orange { font-size: 10.5px; font-weight: 700; fill: var(--orange); }
    .val-muted { font-size: 10.5px; font-weight: 600; fill: var(--muted); }
    .badge-bg { fill: var(--badge-bg); stroke: var(--border); stroke-width: 1; }
    .badge-text { font-size: 10.5px; font-weight: 700; fill: var(--badge-text); }
    .callout-box { fill: var(--callout-bg); stroke: var(--border); stroke-width: 1; opacity: 0.94; }
  </style>

