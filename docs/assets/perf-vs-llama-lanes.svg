<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500" role="img" aria-labelledby="p1-title p1-desc">
  <title id="p1-title">Matched 20K-Context Throughput: inky vs. llama-server (FP16 &amp; Q8_0) — Apple M5 Max (128 GB)</title>
  <desc id="p1-desc">All four 20K-token/lane configurations from 1 to 64 parallel lanes on Apple M5 Max (128 GB): inky --kv8 (430.8 tok/s, 43.6 GiB Metal), inky FP16 (348.5 tok/s, 68.7 GiB Metal), llama-server Q8_0 (190.3 tok/s, 51.7 GiB MTL0 / 80.1 GiB RSS), and llama-server FP16 (156.7 tok/s, 77.8 GiB MTL0 / 74.4 GiB RSS).</desc>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .frame { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .plot-bg { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .title { font-size: 16px; font-weight: 700; fill: #1f2328; }
    .subtitle { font-size: 11.8px; fill: #656d76; }
    .axis-label { font-size: 11.5px; font-weight: 600; fill: #57606a; }
    .tick { font-size: 11px; fill: #656d76; }
    .grid { stroke: #e1e4e8; stroke-width: 1; }
    .axis { stroke: #57606a; stroke-width: 1.25; }
    .sub-txt { font-size: 10px; fill: #656d76; }
    .foot { font-size: 10.5px; fill: #656d76; }
    .c-kv8-line { stroke: #059669; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .c-kv8-dot { fill: #059669; stroke: #ffffff; stroke-width: 1.4; }
    .c-kv8-txt { font-size: 11.5px; font-weight: 700; fill: #059669; }
    .c-kv8-ldr { stroke: #059669; fill: none; stroke-width: 1.2; opacity: 0.82; }
    .c-fp16-line { stroke: #2563eb; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .c-fp16-dot { fill: #2563eb; stroke: #ffffff; stroke-width: 1.4; }
    .c-fp16-txt { font-size: 11.5px; font-weight: 700; fill: #2563eb; }
    .c-fp16-ldr { stroke: #2563eb; fill: none; stroke-width: 1.2; opacity: 0.82; }
    .c-lq8-line { stroke: #d97706; fill: none; stroke-dasharray: 6 4; stroke-linecap: round; stroke-linejoin: round; }
    .c-lq8-dot { fill: #d97706; stroke: #ffffff; stroke-width: 1.4; }
    .c-lq8-txt { font-size: 11.5px; font-weight: 700; fill: #d97706; }
    .c-lq8-ldr { stroke: #d97706; fill: none; stroke-width: 1.2; opacity: 0.82; }
    .c-lfp16-line { stroke: #64748b; fill: none; stroke-dasharray: 6 4; stroke-linecap: round; stroke-linejoin: round; }
    .c-lfp16-dot { fill: #64748b; stroke: #ffffff; stroke-width: 1.4; }
    .c-lfp16-txt { font-size: 11.5px; font-weight: 700; fill: #64748b; }
    .c-lfp16-ldr { stroke: #64748b; fill: none; stroke-width: 1.2; opacity: 0.82; }
    @media (prefers-color-scheme: dark) {
      .frame { fill: #0d1117; stroke: #30363d; }
      .plot-bg { fill: #161b22; stroke: #30363d; }
      .title { fill: #e6edf3; }
      .subtitle { fill: #8b949e; }
      .axis-label { fill: #8b949e; }
      .tick { fill: #8b949e; }
      .grid { stroke: #21262d; }
      .axis { stroke: #8b949e; }
      .sub-txt { fill: #8b949e; }
      .foot { fill: #8b949e; }
      .c-kv8-line { stroke: #34d399; }
      .c-kv8-dot { fill: #34d399; stroke: #0d1117; }
      .c-kv8-txt { fill: #34d399; }
      .c-kv8-ldr { stroke: #34d399; }
      .c-fp16-line { stroke: #60a5fa; }
      .c-fp16-dot { fill: #60a5fa; stroke: #0d1117; }
      .c-fp16-txt { fill: #60a5fa; }
      .c-fp16-ldr { stroke: #60a5fa; }
      .c-lq8-line { stroke: #fbbf24; }
      .c-lq8-dot { fill: #fbbf24; stroke: #0d1117; }
      .c-lq8-txt { fill: #fbbf24; }
      .c-lq8-ldr { stroke: #fbbf24; }
      .c-lfp16-line { stroke: #94a3b8; }
