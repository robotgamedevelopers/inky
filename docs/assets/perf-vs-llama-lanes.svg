  <polyline points="604.0,175.3 613.0,175.3" class="c-fp16-ldr"/>
  <text x="618.0" y="176.3" class="c-fp16-txt">inky FP16: 348.5 tok/s (2.22×)</text>
  <text x="618.0" y="190.8" class="sub-txt">68.7 GiB Metal · exact FP16 KV</text>
