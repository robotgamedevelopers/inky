<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">Throughput vs. Parallel Lanes at 20K Context — Apple M5 Max (128 GB)</title>
  <desc id="chart-desc">Aggregate decode throughput in tokens per second from 1 to 64 parallel lanes on Apple M5 Max (128 GB) with Inkling-2-Mini-Q4_K_M.gguf at 20,480 tokens per lane (434 tok/s / 202% with --kv8, 323 tok/s / 150% with exact FP16 KV) compared to vanilla llama.cpp (215 tok/s = 100%).</desc>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .frame { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .plot-bg { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .title { font-size: 16px; font-weight: 700; fill: #1f2328; }
    .subtitle { font-size: 11.8px; fill: #656d76; }
    .axis-label { font-size: 11.5px; font-weight: 600; fill: #57606a; }
    .tick { font-size: 11px; fill: #656d76; }
    .grid { stroke: #e1e4e8; stroke-width: 1; }
    .axis { stroke: #57606a; stroke-width: 1.25; }
    .ref-100 { stroke: #8c959f; stroke-width: 1.25; stroke-dasharray: 4 4; }
    .ref-label { font-size: 10.5px; font-weight: 600; fill: #57606a; }
    .sub-txt { font-size: 10px; fill: #656d76; }
    .foot { font-size: 10.5px; fill: #656d76; }
    .c-kv8-line { stroke: #059669; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .c-kv8-dot { fill: #059669; stroke: #ffffff; stroke-width: 1.5; }
    .c-kv8-txt { font-size: 12px; font-weight: 700; fill: #059669; }
    .c-kv8-ldr { stroke: #059669; fill: none; stroke-width: 1.2; opacity: 0.8; }
    .c-fp16-line { stroke: #2563eb; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .c-fp16-dot { fill: #2563eb; stroke: #ffffff; stroke-width: 1.5; }
    .c-fp16-txt { font-size: 12px; font-weight: 700; fill: #2563eb; }
    .c-fp16-ldr { stroke: #2563eb; fill: none; stroke-width: 1.2; opacity: 0.8; }
    .c-llama-line { stroke: #64748b; fill: none; stroke-dasharray: 6 4; stroke-linecap: round; stroke-linejoin: round; }
    .c-llama-dot { fill: #64748b; stroke: #ffffff; stroke-width: 1.5; }
    .c-llama-txt { font-size: 12px; font-weight: 700; fill: #64748b; }
    .c-llama-ldr { stroke: #64748b; fill: none; stroke-width: 1.2; opacity: 0.8; }
    @media (prefers-color-scheme: dark) {
      .frame { fill: #0d1117; stroke: #30363d; }
      .plot-bg { fill: #161b22; stroke: #30363d; }
      .title { fill: #e6edf3; }
      .subtitle { fill: #8b949e; }
      .axis-label { fill: #8b949e; }
      .tick { fill: #8b949e; }
      .grid { stroke: #21262d; }
      .axis { stroke: #8b949e; }
      .ref-100 { stroke: #6e7681; }
      .ref-label { fill: #8b949e; }
      .sub-txt { fill: #8b949e; }
      .foot { fill: #8b949e; }
      .c-kv8-line { stroke: #34d399; }
      .c-kv8-dot { fill: #34d399; stroke: #0d1117; }
      .c-kv8-txt { fill: #34d399; }
      .c-kv8-ldr { stroke: #34d399; }
      .c-fp16-line { stroke: #60a5fa; }
      .c-fp16-dot { fill: #60a5fa; stroke: #0d1117; }
      .c-fp16-txt { fill: #60a5fa; }
      .c-fp16-ldr { stroke: #60a5fa; }
      .c-llama-line { stroke: #94a3b8; }
