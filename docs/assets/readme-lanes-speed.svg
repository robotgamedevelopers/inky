      .llama-txt { fill: #cbd5e1; }
      .llama-ldr { stroke: #94a3b8; }
      .sub-txt { fill: #8b949e; }
      .gain-arrow { stroke: #34d399; }
      .gain-head { fill: #34d399; }
      .gain-box { fill: #0f2922; stroke: #34d399; }
      .gain-title { fill: #6ee7b7; }
      .gain-sub { fill: #a7f3d0; }
      .one-box { fill: #0d1117; stroke: #30363d; }
      .one-ldr { stroke: #34d399; }
      .one-txt { fill: #34d399; }
      .foot { fill: #8b949e; }
