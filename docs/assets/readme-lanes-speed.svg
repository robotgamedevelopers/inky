<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">Matched 20K-Context Throughput vs. Parallel Lanes — Apple M5 Max (128 GB)</title>
  <desc id="chart-desc">Single-tenant warmed aggregate decode throughput at ~20,480 tokens per lane across 1 to 64 parallel lanes on Apple M5 Max (128 GB): inky (--kv8) scales from 75.6 tok/s at 1 lane to 430.8 tok/s (275%) at 64 lanes in 43.6 GiB GPU memory, compared to vanilla llama.cpp scaling from 47.4 tok/s to 156.7 tok/s (100%) in 77.8 GiB GPU memory (74.4 GiB RSS).</desc>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .frame { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .plot-bg { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .title { font-size: 16px; font-weight: 700; fill: #1f2328; }
    .subtitle { font-size: 11.8px; fill: #656d76; }
    .axis-label { font-size: 11.5px; font-weight: 600; fill: #57606a; }
    .tick { font-size: 11px; fill: #656d76; }
    .grid { stroke: #e1e4e8; stroke-width: 1; }
    .axis { stroke: #57606a; stroke-width: 1.25; }
    .ref-100 { stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .ref-label { font-size: 10.5px; font-weight: 600; fill: #64748b; }
    .inky-line { stroke: #10b981; fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
    .inky-dot { fill: #10b981; stroke: #ffffff; stroke-width: 1.6; }
    .inky-txt { font-size: 12.2px; font-weight: 700; fill: #059669; }
    .inky-ldr { stroke: #10b981; fill: none; stroke-width: 1.3; }
    .llama-line { stroke: #64748b; fill: none; stroke-width: 2.6; stroke-dasharray: 6 4; stroke-linecap: round; stroke-linejoin: round; }
    .llama-dot { fill: #64748b; stroke: #ffffff; stroke-width: 1.5; }
    .llama-txt { font-size: 12.2px; font-weight: 700; fill: #475569; }
    .llama-ldr { stroke: #64748b; fill: none; stroke-width: 1.3; }
    .sub-txt { font-size: 10.1px; fill: #656d76; }
    .gain-arrow { stroke: #059669; stroke-width: 1.6; fill: none; }
    .gain-head { fill: #059669; }
    .gain-box { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.2; }
    .gain-title { font-size: 11.5px; font-weight: 700; fill: #047857; }
    .gain-sub { font-size: 10px; font-weight: 500; fill: #065f46; }
    .one-box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .one-ldr { stroke: #059669; stroke-width: 1.15; fill: none; }
    .one-txt { font-size: 10.5px; font-weight: 600; fill: #059669; }
    .foot { font-size: 10.5px; fill: #656d76; }
    @media (prefers-color-scheme: dark) {
      .frame { fill: #0d1117; stroke: #30363d; }
      .plot-bg { fill: #161b22; stroke: #30363d; }
      .title { fill: #e6edf3; }
      .subtitle { fill: #8b949e; }
      .axis-label { fill: #8b949e; }
      .tick { fill: #8b949e; }
      .grid { stroke: #21262d; }
      .axis { stroke: #8b949e; }
      .ref-100 { stroke: #6e7681; }
      .ref-label { fill: #8b949e; }
      .inky-line { stroke: #34d399; }
