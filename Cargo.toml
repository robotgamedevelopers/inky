[package]
name = "inky"
version = "0.1.0"
edition = "2021"
description = "Hand-fused Metal inference engine for Thinking Machines Inkling 2 Mini (inkling2_loop)"
license = "GPL-3.0-or-later"

[dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"
block2 = "0.6"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1
