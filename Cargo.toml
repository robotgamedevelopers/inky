[package]
name = "inky-engine"
version = "0.1.0"
edition = "2021"
description = "A hand-fused Metal inference engine for Thinking Machines' Inkling 2 Mini, for Apple Silicon M5 Macs (Metal 4)"
license = "GPL-3.0-or-later"
repository = "https://github.com/robotgamedevelopers/inky"
readme = "README.md"
keywords = ["inference", "metal", "llm", "gguf", "apple-silicon"]
categories = ["command-line-utilities", "science"]
# what a crates.io build needs: the sources, the Metal shaders, the tunings, and the TLA+ specs they embed
include = ["/src/**", "/tunings/**", "/specs/**", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README.md"]

[[bin]]
name = "inky"
path = "src/main.rs"

[dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"
block2 = "0.6"
libc = "0.2"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1
