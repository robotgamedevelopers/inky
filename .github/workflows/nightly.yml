name: nightly
# The checks too slow for the one-minute pull-request CI (ci.yml). Each still fails red here.
# No timeout-minutes on any job or step: a nightly has no time limit, and a slow nightly is not a failure.
# GitHub runs a schedule only from the default branch, so the cron starts once this file is on main;
# workflow_dispatch runs it on any branch by hand (gh workflow run nightly.yml --ref <branch>).
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
# One nightly at a time; a run in progress is never cancelled.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # The release-profile build and unit tests on a clean GitHub-hosted ARM Mac (the old cpu job's build and
  # cargo test --release --bins, about 100 s cold).
  release-cpu:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable 1.98.1
        with:
          toolchain: 1.98.1
      - name: build
        run: cargo build --locked --release
      - name: unit and integration tests (release profile)
        run: cargo test --locked --release --bins --tests
      - name: crates.io package dry-run
        run: cargo publish --locked --dry-run
  # The slow layout models (PrefixTree full, StartTails3) and PrefixTree trace mutants on macOS.
  tla-layout-nightly:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: TLA layout nightly
        env:
          TLA_NIGHTLY: '1'
        run: scripts/check-tla.sh layout-nightly
  # The exhaustive CacheScheduler safety and liveness models and their reversed witnesses
  # (about 195 s with two TLC workers on hetzner2; CacheSchedulerTwoPrefixes alone is 61 s).
  # run_cache_scheduler.sh gives TLC -Xmx8g. ubuntu-latest for a public repository has 4 CPUs and 16 GB of RAM;
  # macos-latest (arm64) has 7 GB, too little for an 8 GB heap, so this job runs on Linux and checks the memory first.
  tla-scheduler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: memory for an 8 GB TLC heap
        run: |
          kb=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)
          echo "MemTotal ${kb} kB"
          # 8 GiB of heap plus room for the JVM and the OS: at least 12 GiB.
          test "$kb" -ge $((12 * 1024 * 1024)) || { echo "runner has too little memory for -Xmx8g" >&2; exit 1; }
      - name: TLA scheduler
        env:
          TLA_NIGHTLY: '1'
          TLC_WORKERS: '4'
        run: scripts/check-tla.sh scheduler
  # Self-hosted runners serve this repository only. A run anywhere else (a fork's dispatch) fails here, loudly,
  # instead of skipping m5-full or leaving it queued for a runner that does not exist.
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: this repository owns the M5 runners
        env:
          REPO: ${{ github.repository }}
        run: |
          test "$REPO" = robotgamedevelopers/inky || { echo "nightly runs only in robotgamedevelopers/inky" >&2; exit 1; }
  # The full M5 gate set on the true release profile: everything ci.yml's m5 jobs run, plus binv, lanes, spans and
  # its sabotage, dbatch, CLI checks, the golden hashes, the long poolgate (tests/nightly.sh) and the serve API
  # negative control.
  # Every gate step runs even when an earlier one fails (if: !cancelled()), so one red gate never hides another.
  m5-full:
    needs: guard
    runs-on: [self-hosted, macOS, ARM64, m5]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: verify pinned Rust toolchain
        run: |
          v=$(rustc --version)
          echo "$v"
          case "$v" in
            "rustc 1.98.1 "*) ;;
            *) echo "expected rustc 1.98.1, got: $v" >&2; exit 1 ;;
          esac
      - name: build
        run: cargo build --locked --release
      - name: GPU router regression
        if: ${{ !cancelled() }}
        run: |
          out=$(cargo test --locked --bins --release engine::tests::router_handles_nonfinite_scores -- --ignored --exact 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Eq '^test result: ok\. 1 passed; 0 failed;' || { echo 'router_handles_nonfinite_scores: expected exactly 1 passed; 0 failed' >&2; exit 1; }
      - name: LoopCD model and mixed-lane regressions
        if: ${{ !cancelled() }}
        run: tests/loopcd-gate.sh
      - name: GPU window attention split-invariance regression
        if: ${{ !cancelled() }}
        run: |
          out=$(cargo test --locked --bins --release engine::tests::k_attn_b_and_blk_are_split_invariant_across_sliding_window -- --ignored --exact 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Eq '^test result: ok\. 1 passed; 0 failed;' || { echo 'k_attn_b split-invariance: expected exactly 1 passed; 0 failed' >&2; exit 1; }
      - name: GPU pool slot zero-fill on reuse
        if: ${{ !cancelled() }}
        run: |
          out=$(cargo test --locked --bins --release blocks::tests::gpu_pool_zero_fills_a_taken_slot -- --ignored --exact 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Eq '^test result: ok\. 1 passed; 0 failed;' || { echo 'gpu_pool_zero_fills_a_taken_slot: expected exactly 1 passed; 0 failed' >&2; exit 1; }
      - name: GPU gates (full set)
        if: ${{ !cancelled() }}
        run: tests/ci.sh full
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: ${{ !cancelled() }}
        with:
          distribution: temurin
          java-version: '21'
      # The long poisoned-slot gate (17 lanes, 64 decode steps; about 126-140 s), from #55.
      - name: long GPU gates
        if: ${{ !cancelled() }}
        run: tests/nightly.sh
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: ${{ !cancelled() }}
        with:
          go-version: '1.26.10'
          cache: false
      - name: serve API probes
        if: ${{ !cancelled() }}
        env:
          SERVECHECK_SABOTAGE: ''
        run: tests/serve.sh
      - name: serve API negative controls
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: tests/serve-negative.sh tests/serve.sh
      - name: one-hour steady-state soak
        if: ${{ !cancelled() }}
        run: |
          INKY_SERVE_KEY=$(openssl rand -hex 16)
          export INKY_SERVE_KEY
          tests/soak.sh --inky "$PWD/target/release/inky" --duration 1h --epoch 10m --seed 20261125
      - name: soak fault qualification
        if: ${{ !cancelled() }}
        run: tests/soak_faults.sh --inky "$PWD/target/release/inky"
