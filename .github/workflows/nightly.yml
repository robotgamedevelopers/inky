name: nightly
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # The heavy TLA runs that do not fit the two-minute pull request budget.
  # No time limit beyond GitHub's default: a slow nightly is not a failure.
  tla:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: all TLA models, witnesses and production traces
        env:
          TLA_NIGHTLY: '1'
        run: scripts/check-tla.sh
  # The long GPU gates that do not fit the pull request budget (tests/nightly.sh).
  # No time limit beyond GitHub's default: a slow nightly is not a failure.
  m5:
    runs-on: [self-hosted, macOS, ARM64, m5]
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: cargo build --release
      - name: long GPU gates
        run: tests/nightly.sh
