name: dependency audit
# Daily and by hand only, on a Linux fleet host (Glenn, 2026-11-25: pull requests run unit tests and a smoke test
# only, and nightly work runs on the fleet). Each audit still fails red on a vulnerable crate.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
# Scheduled and manual runs never cancel one another.
concurrency:
  group: dependency-audit-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  # Self-hosted runners serve this repository only; a run anywhere else fails here, loudly.
  guard:
    runs-on: [self-hosted, Linux, X64, fleet, tlc]
    timeout-minutes: 5
    steps:
      - name: this repository owns the fleet runners
        env:
          REPO: ${{ github.repository }}
        run: |
          test "$REPO" = robotgamedevelopers/inky || { echo "dependency audit runs only in robotgamedevelopers/inky, not $REPO" >&2; exit 1; }
  audit:
    needs: guard
    runs-on: [self-hosted, Linux, X64, fleet, tlc]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable 1.98.1
        with:
          toolchain: 1.98.1
      # Cache only the pinned binary, never the advisory database: each audit fetches fresh advisories.
      - name: Cache cargo-audit
        id: audit-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/inky-cargo-audit/bin/cargo-audit
          key: cargo-audit-0.22.1-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Install cargo-audit
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.1 --locked --root ~/.local/inky-cargo-audit
      - name: Add cargo-audit to PATH
        run: echo "$HOME/.local/inky-cargo-audit/bin" >> "$GITHUB_PATH"
      - name: Audit committed lockfile
        run: cargo audit --file Cargo.lock
      - name: Verify audit rejects a known vulnerability
        run: tests/audit-negative.sh
