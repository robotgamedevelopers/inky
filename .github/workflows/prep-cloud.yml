name: prep-cloud
on:
  push:
    branches:
      - 'prep/v0.2.2-*'
permissions:
  contents: read
concurrency:
  group: prep-cloud-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu:
    # Strictly GitHub-hosted cloud runner (NEVER self-hosted m5 while sprint runs).
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: TLA models, witnesses and production traces
        run: scripts/check-tla.sh
      - name: build
        run: cargo build --release
      - name: unit tests (debug assertions)
        run: cargo test --bins
      - name: unit tests (release)
        run: cargo test --release --bins
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.10'
          cache: false
      - name: soak client tests
        run: go test -race tests/soak_client.go tests/soak_client_test.go
      - name: load client tests
        working-directory: tools/load
        run: go test -race ./...
      - name: inkconvert tests
        working-directory: tools/inkconvert
        run: go test -race ./...
      - name: fleetcheck tests
        working-directory: tests
        run: go vet ./fleetcheck/... && go test -race ./fleetcheck/...
      - name: replay sweep tests
        working-directory: tools/replay
        run: go vet ./... && go test -race ./...
