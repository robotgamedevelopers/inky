name: ci
on:
  push:
    branches: [main]
  pull_request:
  issue_comment:
    types: [created]
permissions:
  contents: read
# Each pull request has one group, and a new push to it cancels the run in progress.
# Each push to main has a group of its own (the run id), so no main run is cancelled or superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Every job here must finish in about a minute (Glenn, 2026-11-23: pull request and push CI averages one minute or
# less). Anything slower runs in .github/workflows/nightly.yml, where it still fails red:
#   the CacheScheduler and nightly layout TLC models, the release-profile unit tests and clean release build,
#   and the slow GPU gates (binv, lanes, spans and its sabotage, dbatch, CLI checks, golden hashes, long poolgate).
jobs:
  # unit: a GitHub-hosted ARM Mac; the CPU-only unit tests in the test profile (overflow checks and debug asserts on).
  # Shaders compile at runtime, so the build needs no GPU. rust-cache keeps target/ and ~/.cargo keyed on Cargo.lock.
  unit:
    if: github.event_name != 'issue_comment'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@v2
      - name: unit and integration tests (debug assertions)
        run: cargo test --locked --bins --tests
      # tests/serve.sh's in-process header test runs here, not in m5-serve. Like serve.sh, require exactly one
      # serve_header_policy test to run and pass, so a rename or removal fails this job.
      - name: serve_header_policy runs exactly once
        run: |
          out=$(cargo test --locked --bins serve_header_policy 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Eq '^test result: ok\. 1 passed; 0 failed;' || { echo 'serve_header_policy: expected exactly 1 passed; 0 failed' >&2; exit 1; }
      - name: crates.io package dry-run
        run: cargo publish --locked --dry-run
  # go: Linux-hosted regression tests for the soak, load, inkconvert, fleetcheck, servecheck, and replay tools.
  go:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: CI policy tests
        run: |
          python3 tests/test_release_ci.py
          python3 tests/test_reviewed_m5.py
      - name: soak client tests
        run: go test -race tests/soak_client.go tests/soak_client_test.go
      - name: load client tests
        working-directory: tools/load
        run: go test -race ./...
      - name: inkconvert tests
        working-directory: tools/inkconvert
        run: go test -race ./...
      - name: install fleetcheck sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor-profiles
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          if [ -f "$profile" ] && [ ! -f /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser -r "$profile"
          fi
      - name: fleetcheck tests
        working-directory: tests
        run: go vet ./fleetcheck/... && go test -race ./fleetcheck/...
      - name: servecheck tests
        working-directory: tests
        run: go vet ./servecheck && go test -race ./servecheck
      - name: replay sweep tests
        working-directory: tools/replay
        run: go vet ./... && go test -race ./...
  # tla: the TLA+ models, witnesses and production traces, one part per job, in parallel.
  tla:
    if: github.event_name != 'issue_comment'
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [memmode, blocks, grouped, traces]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Every TLA check and trace mutant must sit in exactly one tier (this file or nightly.yml); the self-test
      # plants a dropped check, a dropped mutant, an unwired trace script and a doubled part, and needs each red.
      - name: TLA tier coverage
        if: matrix.part == 'memmode'
        run: |
          scripts/check-tla-tiers.sh
          scripts/check-tla-tiers.sh --self-test
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      # The pinned tla2tools.jar, kept across runs; check-tla.sh still checks its SHA-256 every time.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/inky-tla
          key: tla2tools-fdffef247f563ef6edbfd44958d2a82db79e7564e07cb673262d896353fa6713
      - name: TLA ${{ matrix.part }}
        run: TLA_JAR_CACHE="$HOME/.cache/inky-tla" scripts/check-tla.sh ${{ matrix.part }}
  # issue_comment runs the default branch workflow. Resolve the approved PR head and
  # GitHub's exact merge candidate on a hosted machine before scheduling any M5 job.
  m5-approval:
    if: >-
      github.repository == 'robotgamedevelopers/inky' &&
      github.ref == 'refs/heads/main' && github.event_name == 'issue_comment' &&
      github.event.issue.pull_request && startsWith(github.event.comment.body, '/test-m5 ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head: ${{ steps.approval.outputs.head }}
      candidate: ${{ steps.approval.outputs.candidate }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: resolve reviewed merge candidate
        id: approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/reviewed_m5.py

  # Only protected main can access the dispatch key. Public jobs never use a
  # self-hosted runner, and the private receiver publishes the exact-SHA result.
  m5-dispatch:
    needs: m5-approval
    if: >-
      !cancelled() && github.repository == 'robotgamedevelopers/inky' &&
      github.ref == 'refs/heads/main' && (
        github.event_name == 'push' ||
        (github.event_name == 'issue_comment' && github.run_attempt == '1' &&
         needs.m5-approval.result == 'success' && needs.m5-approval.outputs.candidate != '')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: inky-m5-dispatch
    outputs:
      request: ${{ steps.dispatch.outputs.request }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: mint control-repository dispatch token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.INKY_M5_DISPATCH_APP_ID }}
          private-key: ${{ secrets.INKY_M5_DISPATCH_APP_PRIVATE_KEY }}
          owner: robotgamedevelopers
          repositories: ${{ vars.INKY_M5_CONTROL_REPOSITORY }}
          permission-actions: write
      - name: dispatch the reviewed immutable candidate
        id: dispatch
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          M5_CONTROL_REPOSITORY: ${{ vars.INKY_M5_CONTROL_REPOSITORY }}
          MODE: ${{ github.event_name == 'push' && 'main' || 'pr' }}
          HEAD_SHA: ${{ needs.m5-approval.outputs.head || github.sha }}
          CANDIDATE: ${{ needs.m5-approval.outputs.candidate || github.sha }}
        run: python3 scripts/m5_control.py dispatch "$MODE" "$HEAD_SHA" "$CANDIDATE" >> "$GITHUB_OUTPUT"

  m5-gpu:
    needs: m5-dispatch
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: verify the authenticated M5 gpu result
        env:
          GH_TOKEN: ${{ github.token }}
          M5_REPORT_APP_ID: ${{ vars.INKY_M5_REPORT_APP_ID }}
          REQUEST: ${{ needs.m5-dispatch.outputs.request }}
        run: python3 scripts/m5_control.py wait m5-main-gpu "$GITHUB_SHA" "$REQUEST"

  m5-serve:
    needs: m5-dispatch
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: verify the authenticated M5 serve result
        env:
          GH_TOKEN: ${{ github.token }}
          M5_REPORT_APP_ID: ${{ vars.INKY_M5_REPORT_APP_ID }}
          REQUEST: ${{ needs.m5-dispatch.outputs.request }}
        run: python3 scripts/m5_control.py wait m5-main-serve "$GITHUB_SHA" "$REQUEST"
