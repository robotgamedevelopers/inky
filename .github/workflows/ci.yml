name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Each pull request has one group, and a new push to it cancels the run in progress.
# Each push to main has a group of its own (the run id), so no main run is cancelled or superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Jobs:
  #   cpu: a GitHub-hosted ARM Mac; builds and runs the CPU-only unit tests. Shaders compile at
  #        runtime, so the build needs no GPU. It reports in minutes without waiting for the M5.
  #   m5:  the self-hosted M5 Mac; runs GPU gates and loopback API probes against the local model.
  #   go:  Linux-hosted regression tests for the soak and load clients.
  cpu:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: TLA models, witnesses and production traces
        run: scripts/check-tla.sh
      - name: soak qualification shell tests
        run: tests/soak_qualification_test.sh
      - name: build
        run: cargo build --release
      - name: unit and integration tests (debug assertions)
        run: cargo test --locked --bins --tests
      - name: unit tests (release)
        run: cargo test --release --bins
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: release gate tests
        run: python3 tests/test_release_ci.py
      - name: soak client tests
        run: go test -race tests/soak_client.go tests/soak_client_test.go
      - name: load client tests
        working-directory: tools/load
        run: go test -race ./...
      - name: inkconvert tests
        working-directory: tools/inkconvert
        run: go test -race ./...
      - name: install fleetcheck sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor-profiles
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          if [ -f "$profile" ] && [ ! -f /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser -r "$profile"
          fi
      - name: fleetcheck tests
        working-directory: tests
        run: go vet ./fleetcheck/... && go test -race ./fleetcheck/...
      - name: servecheck tests
        working-directory: tests
        run: go vet ./servecheck && go test -race ./servecheck
      - name: replay sweep tests
        working-directory: tools/replay
        run: go vet ./... && go test -race ./...
  m5:
    # A self-hosted M5 Mac: the engine needs Metal 4 and the M5 neural accelerators, which hosted runners lack.
    # Pull requests from forks never run here (the repository also requires approval for outside contributors).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, m5]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: build
        run: cargo build --release
      - name: GPU router regression
        run: cargo test --locked --release router_handles_nonfinite_scores -- --ignored
      - name: LoopCD model and mixed-lane regressions
        run: cargo test --locked --release loopcd_ -- --ignored --test-threads=1
      - name: tests
        run: tests/ci.sh
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.10'
          cache: false
      # servecheck allocates ephemeral loopback ports, bounds requests/server
      # lifetime, and cancels/waits for each child server before removing logs.
      - name: serve API probes
        timeout-minutes: 15
        env:
          SERVECHECK_SABOTAGE: ''
        run: tests/serve.sh
      - name: serve API negative controls
        timeout-minutes: 15
        run: tests/serve-negative.sh tests/serve.sh
