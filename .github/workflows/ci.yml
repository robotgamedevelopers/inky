name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Each pull request has one group, and a new push to it cancels the run in progress.
# Each push to main has a group of its own (the run id), so no main run is cancelled or superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Every job here must finish in about a minute (Glenn, 2026-11-23: pull request and push CI averages one minute or
# less). Anything slower runs in .github/workflows/nightly.yml, where it still fails red:
#   the CacheScheduler and nightly layout TLC models, the release-profile unit tests and clean release build,
#   and the slow GPU gates (binv, lanes, spans and its sabotage, dbatch, CLI checks, golden hashes, long poolgate).
jobs:
  # unit: a GitHub-hosted ARM Mac; the CPU-only unit tests in the test profile (overflow checks and debug asserts on).
  # Shaders compile at runtime, so the build needs no GPU. rust-cache keeps target/ and ~/.cargo keyed on Cargo.lock.
  unit:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@v2
      - name: unit and integration tests (debug assertions)
        run: cargo test --locked --bins --tests
      # tests/serve.sh's in-process header test runs here, not in m5-serve. Like serve.sh, require exactly one
      # serve_header_policy test to run and pass, so a rename or removal fails this job.
      - name: serve_header_policy runs exactly once
        run: |
          out=$(cargo test --locked --bins serve_header_policy 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Eq '^test result: ok\. 1 passed; 0 failed;' || { echo 'serve_header_policy: expected exactly 1 passed; 0 failed' >&2; exit 1; }
      - name: crates.io package dry-run
        run: cargo publish --locked --dry-run
  # go: Linux-hosted regression tests for the soak, load, inkconvert, fleetcheck, servecheck, and replay tools.
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: release gate tests
        run: python3 tests/test_release_ci.py
      - name: soak client tests
        run: go test -race tests/soak_client.go tests/soak_client_test.go
      - name: load client tests
        working-directory: tools/load
        run: go test -race ./...
      - name: inkconvert tests
        working-directory: tools/inkconvert
        run: go test -race ./...
      - name: install fleetcheck sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor-profiles
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          if [ -f "$profile" ] && [ ! -f /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser -r "$profile"
          fi
      - name: fleetcheck tests
        working-directory: tests
        run: go vet ./fleetcheck/... && go test -race ./fleetcheck/...
      - name: servecheck tests
        working-directory: tests
        run: go vet ./servecheck && go test -race ./servecheck
      - name: replay sweep tests
        working-directory: tools/replay
        run: go vet ./... && go test -race ./...
  # tla: the TLA+ models, witnesses and production traces, one part per job, in parallel.
  tla:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [memmode, blocks, grouped, traces]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Every TLA check and trace mutant must sit in exactly one tier (this file or nightly.yml); the self-test
      # plants a dropped check, a dropped mutant, an unwired trace script and a doubled part, and needs each red.
      - name: TLA tier coverage
        if: matrix.part == 'memmode'
        run: |
          scripts/check-tla-tiers.sh
          scripts/check-tla-tiers.sh --self-test
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      # The pinned tla2tools.jar, kept across runs; check-tla.sh still checks its SHA-256 every time.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/inky-tla
          key: tla2tools-fdffef247f563ef6edbfd44958d2a82db79e7564e07cb673262d896353fa6713
      - name: TLA ${{ matrix.part }}
        run: TLA_JAR_CACHE="$HOME/.cache/inky-tla" scripts/check-tla.sh ${{ matrix.part }}
  # The self-hosted M5 Macs: the engine needs Metal 4 and the M5 neural accelerators, which hosted runners lack.
  # Pull requests from forks never run here (the repository also requires approval for outside contributors).
  # Every same-repository pull request runs both, stream bases included: each takes about 40 s.
  # Both jobs build the `ci` profile (release without fat LTO, incremental), which rebuilds in about a second on a
  # runner's warm target/; the nightly workflow runs every gate on the true release profile.
  m5-gpu:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, m5]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: build
        run: cargo build --locked --profile ci
      - name: GPU router regression
        run: cargo test --locked --profile ci router_handles_nonfinite_scores -- --ignored
      - name: GPU gates (pull request set)
        env:
          INKY_BIN: ./target/ci/inky
        run: tests/ci.sh pr
  m5-serve:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, m5]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: build
        run: cargo build --locked --profile ci
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.10'
          cache: false
      # servecheck allocates ephemeral loopback ports, bounds requests/server
      # lifetime, and cancels/waits for each child server before removing logs.
      # serve_header_policy runs in the unit job (cargo test --bins), so this job runs the probes alone.
      - name: serve API probes
        timeout-minutes: 15
        env:
          SERVECHECK_SABOTAGE: ''
          INKY_SERVE_PROBES_ONLY: '1'
        run: tests/serve.sh ./target/ci/inky
      - name: serve API negative controls
        timeout-minutes: 15
        env:
          INKY_SERVE_PROBES_ONLY: '1'
        run: tests/serve-negative.sh tests/serve.sh ./target/ci/inky
