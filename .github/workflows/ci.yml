name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Each pull request has one group, and a new push to it cancels the run in progress.
# Each push to main has a group of its own (the run id), so no main run is cancelled or superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Pull-request and main-push CI runs unit tests and a smoke test, nothing else (Glenn, 2026-11-25), and averages
# about one minute. Both jobs run on GitHub-hosted runners; nothing here touches a self-hosted runner.
# Everything else runs in .github/workflows/nightly.yml on the fleet, where it still fails red: the Go tool suites,
# every TLA+ model, witness and trace check, the slower unit extras (soak qualification shell tests, socket and
# SIGKILL integration tests, trace dumps, the crates.io dry-run), the release-profile build, and every GPU and
# serve gate on the M5 runners. The daily dependency audit is .github/workflows/dependency-audit.yml.
jobs:
  # unit: a GitHub-hosted ARM Mac; clippy, the CPU-only unit tests in the test profile (overflow checks and debug
  # asserts on), and the unit tests of the workflow and release scripts. Shaders compile at runtime, so the build
  # needs no GPU. rust-cache keeps target/ and ~/.cargo keyed on Cargo.lock.
  unit:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable 1.98.1
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: clippy
        run: cargo clippy --locked --bins -- -D warnings
      - name: unit and integration tests (debug assertions)
        run: cargo test --locked --bins --tests
      - name: branch hygiene and CI non-cancellation tests
        run: python3 tests/test_branch_hygiene.py
      - name: release gate tests
        run: python3 tests/test_release_ci.py
  # smoke: build the binary and run it once. The crate links Metal through objc2-metal, so it builds only on macOS;
  # `inky --help` and `inky serve --help` print their usage before any Metal device or model is touched, and an
  # unknown command must fail.
  smoke:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable 1.98.1
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: build
        run: cargo build --locked
      - name: run the binary
        shell: bash
        run: |
          set -euo pipefail
          out=$(./target/debug/inky --help)
          printf '%s\n' "$out"
          grep -Fq 'inky - a hand-fused Metal inference engine' <<< "$out" || { echo 'smoke: inky --help printed no usage' >&2; exit 1; }
          out=$(./target/debug/inky serve --help)
          printf '%s\n' "$out"
          grep -Fq 'usage: inky serve' <<< "$out" || { echo 'smoke: inky serve --help printed no usage' >&2; exit 1; }
          rc=0
          ./target/debug/inky no-such-command > /dev/null 2>&1 || rc=$?
          test "$rc" = 2 || { echo "smoke: inky no-such-command exited $rc, expected the usage error 2" >&2; exit 1; }
