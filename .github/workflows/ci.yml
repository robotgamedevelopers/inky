name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Each pull request has one group, and a new push to it cancels the run in progress.
# Each push to main has a group of its own (the run id), so no main run is cancelled or superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Every job here must finish in about a minute (Glenn, 2026-11-23: pull request and push CI averages one minute or
# less). Anything slower runs in .github/workflows/nightly.yml, where it still fails red:
#   the CacheScheduler and nightly layout TLC models, the release-profile unit tests and clean release build,
#   and the slow GPU gates (binv, lanes, spans and its sabotage, dbatch, CLI checks, golden hashes, long poolgate).
jobs:
  # unit: a GitHub-hosted ARM Mac; the CPU-only unit tests in the test profile (overflow checks and debug asserts on).
  # Shaders compile at runtime, so the build needs no GPU. rust-cache keeps target/ and ~/.cargo keyed on Cargo.lock.
  unit:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable 1.98.1
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: clippy
        run: cargo clippy --locked --bins -- -D warnings
      - name: soak qualification shell tests
        run: tests/soak_qualification_test.sh
      - name: unit and integration tests (debug assertions)
        run: cargo test --locked --bins --tests
      # tests/serve.sh's in-process header test runs here, not in m5-serve. Like serve.sh, require exactly one
      # serve_header_policy test to run and pass, so a rename or removal fails this job.
      - name: serve_header_policy runs exactly once
        run: |
          out=$(cargo test --locked --bins serve_header_policy 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Eq '^test result: ok\. 1 passed; 0 failed;' || { echo 'serve_header_policy: expected exactly 1 passed; 0 failed' >&2; exit 1; }
      - name: memd socket integration tests
        run: |
          out=$(cargo test --locked --bins memd::tests:: -- --ignored 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Eq '^test result: ok\. 2 passed; 0 failed;' || { echo 'memd socket integration: expected 2 passed; 0 failed' >&2; exit 1; }
      - name: spill SIGKILL crash-recovery integration test
        run: |
          out=$(cargo test --locked --bins spill::tests::kill9_mid_write_loses_cache_never_correctness -- --ignored --exact 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Eq '^test result: ok\. 1 passed; 0 failed;' || { echo 'spill kill9 gate: expected exactly 1 passed; 0 failed' >&2; exit 1; }
      - name: trace dump entrypoints emit non-empty JSONL
        run: |
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          out=$(INKY_BLOCK_TRACE_OUT="$tmp/block.ndjson" cargo test --locked --bins cache_scheduler::tests::dump_block_layout -- --ignored --exact 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out" | grep -Eq '^test result: ok\. 1 passed; 0 failed;' && test -s "$tmp/block.ndjson"
          out=$(INKY_CACHE_TRACE_OUT="$tmp/cache.ndjson" cargo test --locked --bins cache_scheduler::tests::dump_cache_scheduler -- --ignored --exact 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out" | grep -Eq '^test result: ok\. 1 passed; 0 failed;' && test -s "$tmp/cache.ndjson"
          out=$(INKY_SCHED_TRACE_OUT="$tmp/sched.jsonl" cargo test --locked --bins serve::scheduler_trace::dump -- --ignored --exact 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out" | grep -Eq '^test result: ok\. 1 passed; 0 failed;' && test -s "$tmp/sched.jsonl"
      - name: crates.io package dry-run
        run: cargo publish --locked --dry-run
  # go: Linux-hosted regression tests for the soak, load, inkconvert, fleetcheck, servecheck, and replay tools.
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: release gate tests
        run: python3 tests/test_release_ci.py
      - name: soak client tests
        run: go test -race tests/soak_client.go tests/soak_client_test.go
      - name: load client tests
        working-directory: tools/load
        run: go test -race ./...
      - name: inkconvert tests
        working-directory: tools/inkconvert
        run: go test -race ./...
      - name: install fleetcheck sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor-profiles
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          if [ -f "$profile" ] && [ ! -f /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser -r "$profile"
          fi
      - name: fleetcheck tests
        working-directory: tests
        run: go vet ./fleetcheck/... && go test -race ./fleetcheck/...
      - name: servecheck tests
        working-directory: tests
        run: go vet ./servecheck && go test -race ./servecheck
      - name: replay sweep tests
        working-directory: tools/replay
        run: go vet ./... && go test -race ./...
  # tla: the TLA+ models, witnesses and production traces, one part per job, in parallel.
  tla:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [memmode, blocks, grouped, traces]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Every TLA check and trace mutant must sit in exactly one tier (this file or nightly.yml); the self-test
      # plants a dropped check, a dropped mutant, an unwired trace script and a doubled part, and needs each red.
      - name: TLA tier coverage
        if: matrix.part == 'memmode'
        run: |
          scripts/check-tla-tiers.sh
          scripts/check-tla-tiers.sh --self-test
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      # The pinned tla2tools.jar, kept across runs; check-tla.sh still checks its SHA-256 every time.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/inky-tla
          key: tla2tools-fdffef247f563ef6edbfd44958d2a82db79e7564e07cb673262d896353fa6713
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable 1.98.1
        if: matrix.part == 'traces'
        with:
          toolchain: 1.98.1
      - name: TLA ${{ matrix.part }}
        run: TLA_JAR_CACHE="$HOME/.cache/inky-tla" scripts/check-tla.sh ${{ matrix.part }}
  # The self-hosted M5 Macs: the engine needs Metal 4 and the M5 neural accelerators, which hosted runners lack.
  # Pull requests from forks never run here (the repository also requires approval for outside contributors).
  # Every same-repository pull request runs both, stream bases included: each takes about 40 s.
  # Both jobs build the `ci` profile (release without fat LTO, incremental), which rebuilds in about a second on a
  # runner's warm target/; the nightly workflow runs every gate on the true release profile.
  # Fail fast with a clear Actions error if zero M5 self-hosted runners are online (instead of queueing 24 hours).
  m5-online-check:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: check online M5 self-hosted runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 scripts/check_m5_runner.py
          --repo "$GITHUB_REPOSITORY"
          --run-id "$GITHUB_RUN_ID"
          --jobs m5-gpu,m5-serve
          --max-queue-seconds 180
  m5-gpu:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, m5]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: verify pinned Rust toolchain
        run: |
          v=$(rustc --version)
          echo "$v"
          case "$v" in
            "rustc 1.98.1 "*) ;;
            *) echo "expected rustc 1.98.1, got: $v" >&2; exit 1 ;;
          esac
      - name: build
        run: cargo build --locked --profile ci
      - name: GPU router regression
        run: |
          out=$(cargo test --locked --bins --profile ci engine::tests::router_handles_nonfinite_scores -- --ignored --exact 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Eq '^test result: ok\. 1 passed; 0 failed;' || { echo 'router_handles_nonfinite_scores: expected exactly 1 passed; 0 failed' >&2; exit 1; }
      - name: GPU window attention split-invariance regression
        run: |
          out=$(cargo test --locked --bins --profile ci engine::tests::k_attn_b_and_blk_are_split_invariant_across_sliding_window -- --ignored --exact 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Eq '^test result: ok\. 1 passed; 0 failed;' || { echo 'k_attn_b split-invariance: expected exactly 1 passed; 0 failed' >&2; exit 1; }
      - name: GPU pool slot zero-fill on reuse
        run: |
          out=$(cargo test --locked --bins --profile ci blocks::tests::gpu_pool_zero_fills_a_taken_slot -- --ignored --exact 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Eq '^test result: ok\. 1 passed; 0 failed;' || { echo 'gpu_pool_zero_fills_a_taken_slot: expected exactly 1 passed; 0 failed' >&2; exit 1; }
      - name: GPU DSpark verify capacity and rejection-sampling gate
        run: |
          out=$(cargo test --locked --profile ci --bin inky engine::tests::dspark_gpu_guards_and_rejection_sampling_gate -- --ignored --exact 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Eq '^test result: ok\. 1 passed; 0 failed;' || { echo 'dspark_gpu_guards_and_rejection_sampling_gate: expected 1 passed' >&2; exit 1; }
      - name: GPU decode dirty-range sync regression
        run: |
          out=$(cargo test --locked --profile ci --bin inky engine::tests::engine_encode_decode_64_positions_syncs_once_then_63_zero_steps -- --ignored --exact 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Eq '^test result: ok\. 1 passed; 0 failed;' || { echo 'engine_encode_decode_64_positions_syncs_once_then_63_zero_steps: expected 1 passed; 0 failed' >&2; exit 1; }
      - name: real GGUF tokenizer 74k corpus roundtrip and determinism
        run: |
          out=$(cargo test --locked --profile ci --bin inky tokenizer::tests::real_gguf_tokenizer_74k_corpus_roundtrip_and_determinism -- --ignored --exact 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Eq '^test result: ok\. 1 passed; 0 failed;' || { echo 'real_gguf_tokenizer_74k_corpus_roundtrip_and_determinism: expected 1 passed; 0 failed' >&2; exit 1; }
      - name: GGUF embedded chat_template parity with serve prompt renderer
        run: |
          out=$(cargo test --locked --profile ci --bin inky serve::tests::gguf_embedded_chat_template_matches_serve_prompt_render_token_for_token -- --ignored --exact 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Eq '^test result: ok\. 1 passed; 0 failed;' || { echo 'gguf_embedded_chat_template_matches_serve_prompt_render_token_for_token: expected 1 passed; 0 failed' >&2; exit 1; }
      - name: GPU gates (pull request set)
        env:
          INKY_BIN: ./target/ci/inky
        run: tests/ci.sh pr
  m5-serve:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, m5]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: verify pinned Rust toolchain
        run: |
          v=$(rustc --version)
          echo "$v"
          case "$v" in
            "rustc 1.98.1 "*) ;;
            *) echo "expected rustc 1.98.1, got: $v" >&2; exit 1 ;;
          esac
      - name: build
        run: cargo build --locked --profile ci
      - name: production scheduler cached-vs-cold and thinking-budget gate
        timeout-minutes: 10
        run: |
          out=$(cargo test --locked --profile ci --bin inky serve::tests::serve_layer3_three_turn_10k_cached_matches_cold_solo -- --ignored --exact 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed;' || { echo 'serve_layer3_three_turn_10k_cached_matches_cold_solo: expected >=1 passed; 0 failed' >&2; exit 1; }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.10'
          cache: false
      # servecheck allocates ephemeral loopback ports, bounds requests/server
      # lifetime, and cancels/waits for each child server before removing logs.
      # serve_header_policy runs in the unit job (cargo test --bins), so this job runs the probes alone.
      - name: serve API probes
        timeout-minutes: 15
        env:
          SERVECHECK_SABOTAGE: ''
          INKY_SERVE_PROBES_ONLY: '1'
        run: tests/serve.sh ./target/ci/inky
      - name: serve API negative controls
        timeout-minutes: 15
        env:
          INKY_SERVE_PROBES_ONLY: '1'
        run: tests/serve-negative.sh tests/serve.sh ./target/ci/inky

  # GitHub satisfies a required job that is skipped. Require a real M5 result for main PRs.
  m5-pr-result:
    if: always() && github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    needs: [m5-gpu, m5-serve]
    steps:
      - name: require both M5 jobs to have passed
        env:
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          GPU: ${{ needs.m5-gpu.result }}
          SERVE: ${{ needs.m5-serve.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SAME_REPOSITORY" != true ]]; then
            echo 'M5 checks are unavailable on fork branches. A maintainer can stage the reviewed change in this repository.' >&2
            exit 1
          fi
          if [[ "$GPU" != success || "$SERVE" != success ]]; then
            echo "Both M5 jobs must have passed (GPU: $GPU, serving: $SERVE)." >&2
            exit 1
          fi
