name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  m5:
    # A self-hosted M5 Mac: the engine needs Metal 4 and the M5 neural accelerators, which hosted runners lack.
    # Pull requests from forks never run here (the repository also requires approval for outside contributors).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, m5]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: cargo build --release
      - name: tests
        run: tests/ci.sh
