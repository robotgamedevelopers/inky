# Release: a pushed tag vX.Y.Z builds inky for darwin/arm64, writes SHA256SUMS and creates the
# GitHub release as a prerelease: it becomes latest only after a real run on it
# (gh release edit TAG --prerelease=false --latest). Assets are inky_<tag>_darwin_arm64,
# inky_<tag>_tunings.tar.gz (the tunings/ folder the binary is built with) and SHA256SUMS.
# The tag must be refs/tags/v*, point to an ancestor of origin/main, match Cargo.toml's version
# with a leading v, have docs/releases/<tag>.md, and carry a non-empty CRATES_IO_TOKEN in the
# tag-scoped crates-io-release environment (docs/RELEASE-TAG-PROTECTION.md).
# Immediately before creating the GitHub release AND immediately before cargo publish, the remote
# tag SHA is re-queried via git ls-remote so a force-moved or deleted tag aborts before publishing.
name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
permissions:
  contents: read
# Release runs on pushed version tags must never cancel in progress.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  main-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: verify tag ref, ancestry on origin/main, Cargo.toml, and release notes
        shell: bash
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin main
          TAG_SHA="$(git rev-parse HEAD)"
          export TAG_SHA
          python3 scripts/release_ci.py --verify-preflight --no-token
      - name: wait for main CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_ci.py "$GITHUB_REPOSITORY" "$(git rev-parse HEAD)"
  release:
    needs: main-ci
    environment: crates-io-release
    permissions:
      contents: write
    # GitHub's own Apple silicon runner: the shaders compile at runtime (newLibraryWithSource),
    # so the build needs no GPU, and the runner has gh and cargo
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: verify tag is on main, matches Cargo.toml, has release notes, and has CRATES_IO_TOKEN
        shell: bash
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main
          TAG_SHA="$(git rev-parse HEAD)"
          export TAG_SHA
          python3 scripts/release_ci.py --verify-preflight
          echo "TAG_SHA=$TAG_SHA" >> "$GITHUB_ENV"
      - name: unit tests
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable 1.98.1
        with:
          toolchain: 1.98.1
      - name: run unit tests
        run: cargo test --locked --release --bins
      - name: crates.io package dry-run
        run: cargo publish --locked --dry-run
      - name: build
        run: cargo build --locked --release
      - name: assets and SHA256SUMS
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/inky "dist/inky_${TAG}_darwin_arm64"
          COPYFILE_DISABLE=1 tar -czf "dist/inky_${TAG}_tunings.tar.gz" tunings
          cd dist
          shasum -a 256 inky_* > SHA256SUMS
          cat SHA256SUMS
      - name: create the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TAG_SHA: ${{ env.TAG_SHA }}
        run: |
          set -euo pipefail
          python3 scripts/release_ci.py --verify-remote-tag origin "$TAG" "$TAG_SHA"
          gh release create "$TAG" dist/* --title "inky $TAG" --notes-file "docs/releases/$TAG.md" --verify-tag --prerelease
      - name: publish inky-engine to crates.io
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          TAG: ${{ github.ref_name }}
          TAG_SHA: ${{ env.TAG_SHA }}
        run: |
          set -euo pipefail
          python3 scripts/release_ci.py --verify-remote-tag origin "$TAG" "$TAG_SHA"
          cargo publish --locked
