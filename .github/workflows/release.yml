# Release: a pushed tag vX.Y.Z builds inky for darwin/arm64, writes SHA256SUMS and creates the
# GitHub release as a prerelease: it becomes latest only after a real run on it
# (gh release edit TAG --prerelease=false --latest). Assets are inky_<tag>_darwin_arm64,
# inky_<tag>_tunings.tar.gz (the tunings/ folder the binary is built with) and SHA256SUMS.
# The tag must equal Cargo.toml's version with a leading v, and the release notes are
# docs/releases/<tag>.md; the run fails before building if either is wrong. The only credential
# is the workflow's GITHUB_TOKEN.
name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
permissions:
  contents: write
jobs:
  release:
    # GitHub's own Apple silicon runner: the shaders compile at runtime (newLibraryWithSource),
    # so the build needs no GPU, and the runner has gh and cargo
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: the tag matches Cargo.toml and has release notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "${TAG#v}" != "$version" ]; then
            echo "tag $TAG does not match Cargo.toml version $version" >&2
            exit 1
          fi
          if [ ! -f "docs/releases/$TAG.md" ]; then
            echo "docs/releases/$TAG.md is missing" >&2
            exit 1
          fi
      - name: build
        run: cargo build --release
      - name: assets and SHA256SUMS
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/inky "dist/inky_${TAG}_darwin_arm64"
          COPYFILE_DISABLE=1 tar -czf "dist/inky_${TAG}_tunings.tar.gz" tunings
          cd dist
          shasum -a 256 inky_* > SHA256SUMS
          cat SHA256SUMS
      - name: create the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* --title "inky $TAG" --notes-file "docs/releases/$TAG.md" --verify-tag --prerelease
